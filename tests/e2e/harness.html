<!doctype html>
<meta charset="utf-8">
<title>video-feedback harness</title>
<body>
<script type="module">
// Страница-обвязка: поддельный hub (post → сервер теста), экран — холст captureStream, микрофон — осциллятор.
navigator.mediaDevices.getDisplayMedia = async () => {
  const c = document.createElement("canvas");
  c.width = 640; c.height = 360;
  const g = c.getContext("2d");
  let n = 0;
  const draw = () => {
    g.fillStyle = `hsl(${(n * 9) % 360} 60% 45%)`;
    g.fillRect(0, 0, 640, 360);
    g.fillStyle = "#fff";
    g.font = "48px sans-serif";
    g.fillText(`кадр ${n++}`, 40, 190);
  };
  draw();
  setInterval(draw, 100);
  return c.captureStream(10);
};
navigator.mediaDevices.getUserMedia = async () => {
  const ac = new AudioContext();
  const osc = ac.createOscillator();
  const out = ac.createMediaStreamDestination();
  osc.connect(out);
  osc.start();
  return out.stream;
};
const hub = {
  url: (name) => `/${name}`,
  addStyle() {},
  el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; },
  async post(path, body) {
    if (path === "/api/send") path = "/__send";
    try {
      const r = await fetch(path, { method: "POST", headers: { "X-Hub": "1" }, body: JSON.stringify(body) });
      const j = await r.json().catch(() => ({}));
      return r.ok ? { data: j } : { error: j.error || `http ${r.status}` };
    } catch (e) { return { error: String(e) }; }
  },
  addSlot(place, spec) { if (place !== "session.composer") throw new Error(`нет места ${place}`); window.__slot = spec; },
};
const { default: register } = await import("/main.js");
register(hub);
const root = document.createElement("div");
document.body.append(root);
// как у хаба 1.27: место session.composer получает ctx {session}; отправка — POST /api/send
const ctx = { session: { name: "chat", state: "idle" } };
window.__ctx = ctx;
window.__root = root;
window.__slot.render(root, { voice: true }, ctx);
window.__ready = true;
</script>
